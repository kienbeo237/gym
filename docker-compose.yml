# Hạ tầng dev. Cổng lệch chuẩn để không đụng dự án khác đang chạy trên cùng máy.
#
# S3: dùng LocalStack thay MinIO vì ảnh minio/minio không kéo được từ mạng này
# (Docker Hub và quay.io đều trả 401, đo 29/09/2026). Đây chỉ là lựa chọn cho
# DEV — API S3 giống nhau nên mã nguồn không đổi; môi trường thật dùng S3 của
# AWS hoặc MinIO cài sẵn trên máy chủ.
name: pt

services:
  postgres:
    image: postgres:17-alpine
    container_name: pt-postgres
    environment:
      POSTGRES_USER: pt_migrator          # chủ sở hữu schema, KHÔNG phải role app dùng
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD — chạy `cp .env.example .env` trước}
      # Mật khẩu của ba role ứng dụng, dùng bởi docker/postgres/init/01-roles.sh
      APP_DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD}
      POSTGRES_DB: pt
      TZ: Asia/Ho_Chi_Minh
    command:
      - postgres
      - -c
      - timezone=Asia/Ho_Chi_Minh
      - -c
      - max_connections=200
    ports: ['55432:5432']
    volumes:
      - pt-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pt_migrator -d pt']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pt-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Thiếu REDIS_PASSWORD} --appendonly yes
    ports: ['56379:6379']
    volumes: ['pt-redisdata:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:?Thiếu REDIS_PASSWORD} ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: localstack/localstack:4
    container_name: pt-s3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      # LocalStack nhận mọi credential; giữ trùng .env cho đỡ nhầm khi đổi sang thật.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Thiếu S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Thiếu S3_SECRET_KEY}
    ports: ['59000:4566']
    volumes:
      - pt-s3data:/var/lib/localstack
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pt-pgdata:
  pt-redisdata:
  pt-s3data:
