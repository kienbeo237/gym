# Site nginx trên MÁY CHỦ (không phải trong container). server-setup.sh thay
# __DOMAIN__ rồi cài vào /etc/nginx/sites-available; certbot thêm khối 443.
#
# Một tên miền, ba đích (tệp đi thẳng trình duyệt <-> S3 CMC, không qua đây):
#   /api/session    -> Next   (route handler đặt cookie)
#   /api/proxy/*    -> Next   (chuyển tiếp gắn token từ cookie)
#   /api/*          -> NestJS
#   /*              -> Next
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Tệp tải lên đi thẳng S3; request qua đây chỉ là JSON.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    # Khai ở cấp server: proxy_set_header trong location sẽ XOÁ mọi header kế thừa.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hai route handler của Next nằm dưới /api — phải khớp TRƯỚC /api/.
    location = /api/session {
        proxy_pass http://127.0.0.1:3210;
    }
    location /api/proxy/ {
        proxy_pass http://127.0.0.1:3210;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4210;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_read_timeout 60s;
    }
}
